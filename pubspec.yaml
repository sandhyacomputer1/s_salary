name: s_salary
description: "A new Flutter project."
# Prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  http: ^1.5.0
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  path_provider: ^2.1.4
  google_maps_flutter: ^2.18.1
  pdf: ^3.13.1
  printing: ^5.15.1
  image_picker: ^1.0.4
  camera: ^0.12.1
  excel_plus: ^2.29.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Only ONE "flutter:" section is allowed in this file.
flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/imglo.jpeg

# App icon configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/images/imglo.jpeg"
  min_sdk_android: 21